<!-- CSS Units -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .px {
            font-size: 16px; /* 16 pixels */
        } 
        .parent {
            height: 5rem; /* 200 pixels */
            width: 5rem; /* 50% of the parent container's width */
            height: 80px; /* 200 pixels */
            background-color:orange;
            
        }   
        .child {
          background-color:rgb(221, 58, 22);
        width:50%;
        height:50%;
        }
    </style>
</head>
<body>
    <h2>CSS Units</h2>
    <div class="px">PX</div>
    <div class="parent"></div>
    <div class="child"></div>
</body>
</body>
</html>
